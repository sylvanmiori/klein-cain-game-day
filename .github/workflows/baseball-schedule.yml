name: 413 Baseball weekend schedule

# Hardened schedule cadence for 4:13 Baseball (15U travel team, Spring TX).
# The workflow pulls the weekend tournament schedule from the Perfect Game
# team page and commits it to content/baseball/schedule.json. A commit here
# pushes to main, which Cloudflare Workers Builds deploys.
#
# Known Perfect Game timing (Steven, 2026-10-08):
# - New tournament schedules are released by Wednesday midnight CT.
# - The Sunday schedule (bracket-day games) is updated by ~Saturday 10-11pm CT.
#
# Runs:
# - Thursday 10:00 UTC (5:00am CDT / 4:00am CST): PRIMARY pull. PG releases
#   by Wednesday midnight, so this lands the weekend schedule before anyone
#   checks the site Thursday morning.
# - Thursday 23:00 UTC (6:00pm CDT / 5:00pm CST): second-chance catch for late
#   PG posts, corrections, or a failed morning run.
# - Sunday 04:30 and 05:30 UTC: Saturday-night Sunday-schedule catch.
#   04:30 UTC = 11:30pm Sat CDT / 10:30pm Sat CST; 05:30 UTC = 12:30am Sun
#   CDT / 11:30pm Sat CST. At least one run lands at/after 11:30pm CT
#   Saturday in both DST regimes, after PG's ~10-11pm Sunday update.
#   This refreshes schedule.json (Home "This Weekend" cards + the Schedule
#   tournament game list are build-time from this file) and the dated
#   snapshot the bracket job merges into.
#
# Failure behavior: each run retries the scrape up to 3 times (5 minutes
# apart) for transient PG/network failures. A single malformed tournament
# row can never fail the run (scripts/baseball-pg.mjs skips bad rows with a
# capture note). The commit step only commits when the file content actually
# changed, so retries and extra runs never spam git history.

on:
  schedule:
    - cron: '0 10 * * 4'
    - cron: '0 23 * * 4'
    - cron: '30 4 * * 0'
    - cron: '30 5 * * 0'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: baseball-schedule
  cancel-in-progress: false

jobs:
  schedule:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: Refresh weekend schedule from Perfect Game
        run: |
          attempt=1
          while [ "$attempt" -le 3 ]; do
            if npm run baseball:schedule; then
              echo "Schedule refresh succeeded on attempt $attempt."
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Schedule refresh failed after 3 attempts."
              exit 1
            fi
            echo "Attempt $attempt failed; retrying in 5 minutes."
            sleep 300
            attempt=$((attempt + 1))
          done

      - name: Commit weekend schedule
        run: |
          git config user.name "Cain Game Day Bot"
          git config user.email "actions@users.noreply.github.com"
          git add content/baseball/schedule.json
          # schedule-error.json only exists when the scrape failed; commit it
          # too so the failure is visible in git history.
          [ -f content/baseball/schedule-error.json ] && git add content/baseball/schedule-error.json
          # Dated raw snapshots: stage the snapshots directory whenever the
          # run wrote one. The file always carries a fresh scraped_at, so a
          # successful run always stages a change here.
          [ -d content/baseball/pg-snapshots ] && git add content/baseball/pg-snapshots
          git diff --cached --quiet || git commit -m "413 Baseball: refresh weekend schedule from Perfect Game"
          git push

name: Advance the season

# Deterministic public-data jobs. No language model runs here.
# build-editions.mjs creates a starter page for any scheduled game that has
# none. promote-edition.mjs decides which edition the home page shows, keeps the live
# score card pointed at that game, and captures a final score once one exists.
# refresh-facts.mjs updates records, predictions, ratings, ranks and weather.
# promote-edition.mjs also captures final scores, season totals and verified
# game-only statistics, then selects the Player of the Game from those rows.
# Each carries its own source and timestamp, and a source outage keeps the
# previous verified value.
#
# A commit here pushes to main, which Cloudflare Workers Builds deploys.
# Every automated fact change is therefore a reviewable diff in git history.

on:
  schedule:
    # 6:00 AM Central, daily: records and the published pick.
    - cron: '0 11 * * *'
    # Every three hours on Thursday and Friday, when the forecast matters.
    - cron: '0 */3 * * 4,5'
    # Saturday morning and afternoon: retry while coaches post Friday stats.
    - cron: '0 14,17,20 * * 6'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-facts
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      # Create any missing edition first, so a newly reached week has a page
      # for the steps below to fill in.
      - name: Create missing editions
        id: editions
        run: npm run editions

      # Then promote: it decides which edition is current and captures a final
      # score, a recap, game statistics and Player of the Game.
      - name: Promote the current edition
        id: promote
        run: npm run promote

      - name: Read public sources
        id: refresh
        run: npm run refresh

      # The same checks that gate a human edit gate a machine one.
      - name: Validate editions
        run: npm run validate

      - name: Commit refreshed facts
        if: steps.editions.outputs.changed == 'true' || steps.promote.outputs.changed == 'true' || steps.refresh.outputs.changed == 'true'
        run: |
          git config user.name "Cain Game Day Bot"
          git config user.email "actions@users.noreply.github.com"
          git add content/ public/live-score.json
          git diff --cached --quiet || git commit -m "Advance the season from public sources"
          git push
